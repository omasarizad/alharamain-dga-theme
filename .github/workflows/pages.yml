name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: |
          npm ci
          pip install --quiet markdown
      - name: Build page, Tailwind CSS, components and changes
        run: |
          python3 scripts/build-home.py
          npm run build:css
          python3 scripts/build-components.py
          python3 scripts/build-changes.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html changes.html components.html css js assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
